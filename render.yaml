services:
  - type: web
    name: khbd-ai-pro
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
        # Thêm API Key của bạn trên Render Dashboard > Environment
