<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="60%" stop-color="#7C2D12" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Shield/Badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="2.5" />

  <g transform="translate(64, 68)" filter="url(#favGlow)">
    <!-- Book Pages -->
    <!-- Left page -->
    <path d="M 0 20 C -20 12 -36 14 -46 22 L -46 -8 C -36 -14 -20 -12 0 -6 Z" fill="#FFFFFF" />
    <!-- Right page -->
    <path d="M 0 20 C 20 12 36 14 46 22 L 46 -8 C 36 -14 20 -12 0 -6 Z" fill="#E2E8F0" />
    <!-- Ribbon -->
    <path d="M -1.5 -8 L 1.5 -8 L 1.5 24 L 0 22 L -1.5 24 Z" fill="url(#favGold)" />

    <!-- Graduation Cap Top -->
    <g transform="translate(0, -28)">
      <polygon points="0,-14 34,-2 0,10 -34,-2" fill="url(#favGold)" />
      <polygon points="0,-10 26,-2 0,6 -26,-2" fill="#FEF08A" opacity="0.9" />
      <!-- Cap base -->
      <path d="M -16 2 C -16 9 16 9 16 2 L 14 -1 C 14 6 -14 6 -14 -1 Z" fill="#B45309" />
      <!-- Tassel -->
      <circle cx="0" cy="-2" r="2.5" fill="#78350F" />
      <path d="M 0 -2 C 9 -2 22 4 25 14" stroke="#FEF08A" stroke-width="1.5" fill="none" />
      <circle cx="25" cy="14" r="2" fill="url(#favGold)" />
    </g>

    <!-- Center AI Sparkle -->
    <g transform="translate(0, 5)">
      <path d="M 0 -9 Q 0 0 9 0 Q 0 0 0 9 Q 0 0 -9 0 Q 0 0 0 -9 Z" fill="url(#favGold)" />
      <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
    </g>
  </g>
</svg>
