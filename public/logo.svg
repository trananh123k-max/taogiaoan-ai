<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Background Badge Gradient -->
    <linearGradient id="eduBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="45%" stop-color="#9A3412" />
      <stop offset="85%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="eduGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Book Left Page Gradient -->
    <linearGradient id="bookLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Book Right Page Gradient -->
    <linearGradient id="bookRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- AI Cyan Sparkle Gradient -->
    <linearGradient id="aiCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="eduShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
    
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Badge -->
  <g filter="url(#eduShadow)">
    <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#eduBgGrad)" stroke="url(#eduGoldGrad)" stroke-width="4" stroke-opacity="0.85" />
  </g>

  <!-- Inner Soft Ring / Border -->
  <rect x="26" y="26" width="204" height="204" rx="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6 4" />

  <!-- === ICON ELEMENTS === -->
  <g transform="translate(128, 134)">
    
    <!-- 1. OPEN BOOK BASE (Kế hoạch bài dạy / Sách KNTT) -->
    <!-- Left Page Underlay / Spine -->
    <path d="M 0 42 C -40 28 -72 32 -92 48 L -92 -12 C -72 -26 -40 -22 0 -10 Z" fill="#94A3B8" opacity="0.4" />
    <!-- Right Page Underlay / Spine -->
    <path d="M 0 42 C 40 28 72 32 92 48 L 92 -12 C 72 -26 40 -22 0 -10 Z" fill="#64748B" opacity="0.4" />

    <!-- Left Book Page Main -->
    <path d="M 0 36 C -38 22 -68 26 -88 40 L -88 -18 C -68 -30 -38 -26 0 -14 Z" fill="url(#bookLeftGrad)" />
    <!-- Left Page Text Lines Simulation -->
    <path d="M -72 -4 C -56 -10 -34 -8 -16 -3" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <path d="M -72 8 C -56 2 -34 4 -16 9" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <path d="M -72 20 C -56 14 -34 16 -16 21" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />

    <!-- Right Book Page Main -->
    <path d="M 0 36 C 38 22 68 26 88 40 L 88 -18 C 68 -30 38 -26 0 -14 Z" fill="url(#bookRightGrad)" />
    <!-- Right Page Text Lines Simulation -->
    <path d="M 16 -3 C 34 -8 56 -10 72 -4" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <path d="M 16 9 C 34 4 56 2 72 8" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <path d="M 16 21 C 34 16 56 14 72 20" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />

    <!-- Book Center Seam / Bookmark Ribbon (Amber Gold) -->
    <path d="M -3 -16 L 3 -16 L 3 46 L 0 42 L -3 46 Z" fill="url(#eduGoldGrad)" />

    <!-- 2. GRADUATION CAP (Mũ Cử Nhân / Học vị / Giáo dục) -->
    <g transform="translate(0, -56)">
      <!-- Cap Base Diamond Top -->
      <polygon points="0,-28 66,-4 0,20 -66,-4" fill="url(#eduGoldGrad)" filter="url(#goldGlow)" />
      <!-- Cap Inner Diamond -->
      <polygon points="0,-20 50,-4 0,12 -50,-4" fill="#FEF08A" opacity="0.9" />
      
      <!-- Cap Skull Cap / Underneath -->
      <path d="M -30 4 C -30 18 30 18 30 4 L 26 -2 C 26 12 -26 12 -26 -2 Z" fill="#B45309" />
      
      <!-- Tassel Button & Cord -->
      <circle cx="0" cy="-4" r="4.5" fill="#78350F" />
      <path d="M 0 -4 C 18 -4 44 8 48 26" stroke="#FEF08A" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <!-- Tassel Fringe -->
      <polygon points="48,26 44,40 52,40" fill="url(#eduGoldGrad)" />
      <circle cx="48" cy="27" r="3" fill="#B45309" />
    </g>

    <!-- 3. AI / DIGITAL PEDAGOGY SPARKLE (Sao Trí Tuệ Nhân Tạo & Năng Lực Số) -->
    <!-- Main Center AI Star -->
    <g transform="translate(0, 8)" filter="url(#goldGlow)">
      <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="url(#eduGoldGrad)" />
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- Small Left Sparkle -->
    <path d="M -54 -38 Q -54 -28 -44 -28 Q -54 -28 -54 -18 Q -54 -28 -64 -28 Q -54 -28 -54 -38 Z" fill="url(#aiCyanGrad)" />
    
    <!-- Small Right Sparkle -->
    <path d="M 56 -36 Q 56 -28 64 -28 Q 56 -28 56 -20 Q 56 -28 48 -28 Q 56 -28 56 -36 Z" fill="url(#aiCyanGrad)" />
  </g>

  <!-- Bottom Arch Subtitle "KNTT • 5512" Accent Dot -->
  <g transform="translate(128, 222)">
    <circle cx="-16" cy="0" r="2.5" fill="#F59E0B" />
    <circle cx="0" cy="0" r="3.5" fill="#FDE047" />
    <circle cx="16" cy="0" r="2.5" fill="#F59E0B" />
  </g>
</svg>
